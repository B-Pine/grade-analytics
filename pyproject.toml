[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grade-analytics"
version = "0.1.0"
description = "Process student grade records from CSV and generate JSON analytics reports."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
grade-analytics = "grade_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]